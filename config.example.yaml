# Mobile Agent Portable MVP 示例配置
# 用法：cp config.example.yaml config.yaml 然后按需修改（install-termux.sh 会自动复制）
# 注意：本文件只保留两层结构，未安装 PyYAML 的 Termux 也能解析；
#       敏感信息请用 ${环境变量}，不要写死在文件里。

stream: true

llm:
  # 模型服务地址：
  #   手机本机跑 llama-server → http://127.0.0.1:8080/v1
  #   局域网另一台机器      → http://192.168.1.x:8080/v1
  base_url: http://127.0.0.1:8080/v1
  model: qwen2.5-3b-instruct-q4_k_m.gguf
  temperature: 0.2
  timeout: 300

agent:
  max_context: 4096
  max_steps: 4
  max_memory_entries: 50

memory:
  enabled: true
  max_items: 10
  # 记忆文件路径，留空用默认的 memory/memory.json
  path: ""

tools:
  enabled: true
  legacy_protocol: false
  normalize_punctuation: true
  flat_arguments: true

performance:
  auto_detect_context: true
  tool_result_max_chars: 1000
  memory_max_items: 5
  memory_max_ratio: 0.10
  system_prompt_max_tokens: 300
  max_output_tokens: 512
  chat_tool_gate: true

# 模型提供方（留空则沿用上面的 llm.*）
model:
  provider: openai-compatible
  base_url: ""
  name: ""

# 网关：HTTP / QQ 的统一入口
gateway:
  # 只在本机使用时保持 127.0.0.1；要接受局域网（如 QQ 实现在电脑上）改成 0.0.0.0
  host: 127.0.0.1
  port: 8787
  # none：不认证（仅监听 127.0.0.1 时使用）；token：需要 Bearer Token
  auth: token
  token: ${MOBILE_AGENT_GATEWAY_TOKEN}
  max_sessions: 16
  idle_seconds: 3600

# QQ Bot（OneBot v11 HTTP）
qq:
  enabled: false
  adapter: onebot
  api_base: http://127.0.0.1:3000
  token: ${MOBILE_AGENT_QQ_TOKEN}
  self_id: ""
  require_at: true
  reply_group: true
  at_sender: false
  max_chars: 1200
  allow_users: ""

host:
  profile: auto

extension:
  admin_enabled: false

logging:
  level: INFO
  file: ""
